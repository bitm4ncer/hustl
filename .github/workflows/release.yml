name: Release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Client Windows
            os: windows-latest
            script: dist:win
            artifact: client-windows
            files: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - name: Client macOS
            os: macos-latest
            script: dist:mac
            artifact: client-macos
            files: |
              dist/*.dmg
              dist/latest-mac.yml
              dist/*.blockmap
          - name: Client Linux
            os: ubuntu-latest
            script: dist:linux
            artifact: client-linux
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
              dist/*.blockmap
          - name: Standalone Windows
            os: windows-latest
            script: dist:standalone:win
            artifact: standalone-windows
            files: |
              dist/standalone/*.exe
              dist/standalone/standalone.yml
              dist/standalone/*.blockmap
          - name: Standalone Linux
            os: ubuntu-latest
            script: dist:standalone:linux
            artifact: standalone-linux
            files: |
              dist/standalone/*.AppImage
              dist/standalone/standalone-linux.yml
              dist/standalone/*.blockmap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rejects the lock file on Linux/macOS because it was generated
      # on Windows and misses a few platform-specific optional entries.
      # `npm install` resolves them on the runner without changing the source.
      - run: npm install --no-audit --no-fund

      - run: npm run icons:icns

      - run: npm test

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # The builds are unsigned on purpose. Without this, electron-builder
          # tries to discover a signing identity on the macOS runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: hustl-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Stable names power the download buttons on the website and in the
      # README. The versioned files stay on the release as well.
      - name: Create stable download names
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/hustl-client-windows/*.exe release/Hustl-Setup.exe
          cp artifacts/hustl-client-macos/*-arm64.dmg release/Hustl-arm64.dmg
          cp artifacts/hustl-client-macos/*-x64.dmg release/Hustl-x64.dmg
          cp artifacts/hustl-client-linux/*.AppImage release/Hustl.AppImage
          cp artifacts/hustl-standalone-windows/*.exe release/Hustl-Standalone-Setup.exe
          cp artifacts/hustl-standalone-linux/*.AppImage release/Hustl-Standalone.AppImage
          # Old names stay available for existing links.
          cp artifacts/hustl-client-windows/*.exe release/Hustl-win.exe
          cp artifacts/hustl-client-macos/*-arm64.dmg release/Hustl-mac-arm64.dmg
          cp artifacts/hustl-client-macos/*-x64.dmg release/Hustl-mac-x64.dmg
          cp artifacts/hustl-client-linux/*.AppImage release/Hustl-linux.AppImage
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            release/*
          generate_release_notes: true
